services:
  - type: web
    name: budgetpet
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATA_DIR
        value: /data
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.1-flash-lite
    disk:
      name: budgetpet-data
      mountPath: /data
      sizeGB: 1
